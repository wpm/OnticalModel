[project]
name = "ontical_model"
version = "0.1.0"
description = "Ontical Multi-agent Model Server"
readme = "README.md"
authors = [
    { name = "W.P. McNeill", email = "billmcn@gmail.com" }
]
requires-python = ">=3.10.19"
dependencies = [
    "ray[serve]>=2.52",
    "pydantic>=2.12",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "pyyaml>=6.0",
    "annotated-types>=0.7.0",
    "langchain>=1.1.3",
    "langchain-openai>=1.1.1",
    "langchain-anthropic>=1.2.0",
    "langgraph-checkpoint-redis>=0.3.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "requests>=2.32.0",
]

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"
