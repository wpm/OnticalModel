name: Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.11"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull LLM server image
        working-directory: test/fixtures/ontical-test-llm
        run: docker compose pull llm-server

      - name: Start LLM server
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker compose up -d llm-server
          echo "Waiting for LLM server to be healthy..."
          timeout 180 bash -c 'until docker compose ps llm-server | grep -q "healthy"; do sleep 5; done'
          echo "LLM server is ready!"

      - name: Run unit tests
        run: |
          uv run pytest test/unit/ --cov=ontical_model --cov-config=.coveragerc --cov-report=xml --cov-report=term

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Tear down LLM server
        if: always()
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker compose down -v

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.11"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker images
        working-directory: test/fixtures/ontical-test-llm
        run: docker compose pull

      - name: Create coverage data directory
        run: |
          mkdir -p .coverage-data
          chmod 777 .coverage-data

      - name: Start Docker Compose services
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          timeout 300 bash -c 'until docker compose ps | grep -q "healthy"; do sleep 5; done'
          echo "Waiting for Ray Serve deployment to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/ > /dev/null 2>&1 || [ $? -eq 22 ]; do echo "Waiting for Ray Serve..."; sleep 2; done'
          echo "Ray Serve is ready!"

      - name: Run integration tests
        run: |
          uv run pytest test/integration/ --cov=ontical_model --cov-config=.coveragerc --cov-report=xml --cov-report=term

      - name: Stop ontical-model-server to flush coverage
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker compose stop ontical-model-server

      - name: Combine coverage data
        run: |
          uv run coverage combine .coverage-data/
          uv run coverage xml
          uv run coverage report

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Collect Docker logs on failure
        if: failure()
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker compose logs > ${{ github.workspace }}/docker-logs.txt

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

      - name: Tear down Docker Compose
        if: always()
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker compose down -v

  code-review:
    name: Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: |
          curl -fsSL https://raw.githubusercontent.com/anthropics/claude-code/main/install.sh | sh

      - name: Run code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          git diff origin/${{ github.base_ref }}...HEAD > changes.diff
          if [ -s changes.diff ]; then
            echo "Reviewing changes..."
            claude --non-interactive "Review this code change and provide feedback on potential issues, improvements, and best practices. Focus on correctness, performance, security, and maintainability." < changes.diff > review.md
          else
            echo "No changes to review"
            exit 0
          fi

      - name: Post review as comment
        if: always() && hashFiles('review.md') != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 Automated Code Review\n\n${review}`
            });
