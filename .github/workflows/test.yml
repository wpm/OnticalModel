name: Test

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.11"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run unit tests
        run: |
          uv run pytest test/unit/ --cov=ontical_model --cov-config=.coveragerc --cov-report=xml --cov-report=term

      - name: Upload unit test coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.11"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker images
        working-directory: test/fixtures/ontical-test-llm
        run: docker compose pull

      - name: Create coverage data directory
        run: |
          mkdir -p .coverage-data
          chmod 777 .coverage-data

      - name: Start Docker Compose services
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          timeout 300 bash -c 'until docker compose ps | grep -q "healthy"; do sleep 5; done'
          echo "Waiting for Ray Serve deployment to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/ > /dev/null 2>&1 || [ $? -eq 22 ]; do echo "Waiting for Ray Serve..."; sleep 2; done'
          echo "Ray Serve is ready!"

      - name: Run integration tests
        run: |
          uv run pytest test/integration/ --cov=ontical_model --cov-config=.coveragerc --cov-report=xml --cov-report=term

      - name: Stop ontical-model-server to flush coverage
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker compose stop ontical-model-server

      - name: Combine coverage data
        run: |
          uv run coverage combine .coverage-data/
          uv run coverage xml
          uv run coverage report

      - name: Upload integration test coverage
        uses: codecov/codecov-action@v4
        if: always()
        continue-on-error: true
        with:
          file: ./coverage.xml
          flags: integration
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Collect Docker logs on failure
        if: failure()
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker compose logs > ${{ github.workspace }}/docker-logs.txt

      - name: Upload Docker logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs
          path: docker-logs.txt

      - name: Tear down Docker Compose
        if: always()
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker compose down -v

  code-review:
    name: Code Review
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
