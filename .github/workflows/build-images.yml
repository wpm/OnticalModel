name: Build Docker Images

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'test/fixtures/ontical-test-llm/Dockerfile.*'
      - 'test/fixtures/ontical-test-llm/start-ollama.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push llm-server
        working-directory: test/fixtures/ontical-test-llm
        run: |
          docker buildx build \
            --file Dockerfile.llm-server \
            --tag ghcr.io/wpm/onticalmodel/llm-server:latest \
            --push \
            --platform linux/amd64 \
            .

      - name: Build and push ray-ontical
        run: |
          docker buildx build \
            --file test/fixtures/ontical-test-llm/Dockerfile.ray-ontical \
            --tag ghcr.io/wpm/onticalmodel/ray-ontical:latest \
            --push \
            --platform linux/amd64 \
            .
