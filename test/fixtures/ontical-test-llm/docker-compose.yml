services:
  # Redis: Checkpoint storage for LangGraph agent state
  #
  # This container provides persistent storage for conversation checkpoints,
  # allowing agents to maintain state across multiple interactions. Redis 8.0+
  # includes RedisJSON and RediSearch modules by default, which are required
  # for LangGraph's RedisSaver checkpointer.
  #
  # Not exposed externally - only accessible within docker network at redis:6379
  #
  # Health: Checks Redis ping to verify service is responding
  # Volume: redis_data persists checkpoint data between test runs
  redis:
    image: redis:latest
    container_name: redis
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # LLM Server: Ollama instance serving the llama3.2:1b model
  #
  # This container provides the core language model functionality for testing.
  # It runs Ollama (https://ollama.ai) with the llama3.2:1b model pre-loaded
  # for fast startup. The model is pulled on first startup and cached in the
  # ollama_data volume for subsequent runs.
  #
  # Configuration files:
  #   - Dockerfile.llm-server: Container image definition
  #   - start-ollama.sh: Startup script that pulls the model
  #
  # Ports:
  #   - 11434: Ollama HTTP API endpoint (OpenAI-compatible)
  #
  # Health: Checks /api/tags endpoint to verify Ollama is responding
  # Volume: ollama_data persists downloaded models between container restarts
  llm-server:
    image: ghcr.io/wpm/onticalmodel/llm-server:latest
    build:
      context: .
      dockerfile: Dockerfile.llm-server
    container_name: llm-server
    ports:
      - "11434:11434"  # Ollama API
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ray Server: Ray cluster head node for distributed computing
  #
  # This container runs a Ray head node that coordinates the distributed execution
  # of Ray Serve applications. It provides the infrastructure for deploying and
  # scaling the OnticalModelServer.
  #
  # The container mounts the project workspace to enable live code updates during
  # development. It starts a Ray cluster in head mode and keeps running via tail.
  #
  # Configuration files:
  #   - Dockerfile.ray-ontical: Container image definition
  #
  # Ports:
  #   - 8000: Ray Serve HTTP endpoint for deployed applications
  #   - 10001: Ray Client port for remote job submission
  #   - 6379: Ray Global Control Store (GCS) for cluster coordination
  #
  # Environment:
  #   - LLM_HOST: Hostname for the Ollama server (used by tests)
  #   - PYTHONPATH: Ensures project code is importable
  #
  # Health: Uses 'ray status' to verify the cluster is operational
  # Depends: Waits for llm-server to start (but not be healthy)
  ray-server:
    image: ghcr.io/wpm/onticalmodel/ray-ontical:latest
    build:
      context: ../../../
      dockerfile: test/fixtures/ontical-test-llm/Dockerfile.ray-ontical
    container_name: ray-server
    ports:
      - "8000:8000"  # Ray Serve
      - "10001:10001"  # Ray client
      - "6379:6379"  # Ray GCS
    volumes:
      - ../../../:/workspace
    working_dir: /workspace
    command: >
      bash -c "ray start --head --node-ip-address=0.0.0.0 --port=6379 --ray-client-server-port=10001 &&
               tail -f /dev/null"
    environment:
      - LLM_HOST=llm-server
      - PYTHONPATH=/workspace
    depends_on:
      llm-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ontical Model Server: Ray Serve deployment of OnticalModelServer
  #
  # This container deploys the OnticalModelServer application to the Ray cluster.
  # It uses 'ray serve run' to deploy the application defined in serve_config.yaml,
  # which configures the LangGraphAgent with the NameAgeOccupation schema.
  #
  # The deployment connects to the Ray cluster as a client (via ray://ray-server:10001)
  # and deploys the application to be served on the Ray cluster's HTTP endpoint
  # (http://ray-server:8000/).
  #
  # Coverage tracking is enabled to measure code coverage during integration tests.
  # The command wraps 'serve run' with 'coverage run' to collect execution data
  # that gets merged with unit test coverage in CI.
  #
  # Configuration files:
  #   - serve_config.yaml: Ray Serve application configuration
  #   - Dockerfile.ray-ontical: Container image (shared with ray-server)
  #
  # Environment:
  #   - RAY_ADDRESS: Ray cluster address for deployment
  #   - RAY_LOG_LEVEL: Set to WARNING to reduce noise in test output
  #   - PYTHONPATH: Ensures project code is importable
  #   - COVERAGE_PROCESS_START: Enables coverage subprocess tracking
  #
  # Health: Checks the Ray Serve endpoint to verify deployment is responding
  #   - Uses 30 retries with 30s start_period because deployment can be slow
  #   - Integration tests wait for this healthcheck before running
  #
  # Depends: Waits for both ray-server and llm-server to be healthy before deploying
  ontical-model-server:
    image: ghcr.io/wpm/onticalmodel/ray-ontical:latest
    container_name: ontical-model-server
    volumes:
      - ../../../:/workspace
    working_dir: /workspace
    command: >
      bash -c "coverage run --rcfile=/workspace/.coveragerc $(which serve) run test/fixtures/ontical-test-llm/serve_config.yaml --address ray://ray-server:10001"
    environment:
      - RAY_ADDRESS=ray://ray-server:10001
      - RAY_LOG_LEVEL=WARNING
      - PYTHONPATH=/workspace
      - COVERAGE_PROCESS_START=/workspace/.coveragerc
    depends_on:
      ray-server:
        condition: service_healthy
      llm-server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "-X", "POST", "-H", "Content-Type: application/json", "-d", '["healthcheck", "ping"]', "http://ray-server:8000/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  redis_data:
  ollama_data:
