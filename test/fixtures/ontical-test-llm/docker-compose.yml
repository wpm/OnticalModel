services:
  llm-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-server
    ports:
      - "11434:11434"  # Ollama API
    volumes:
      - ollama_data:/root/.ollama

  ray-server:
    image: rayproject/ray:latest
    container_name: ray-server
    ports:
      - "8265:8265"  # Ray dashboard
      - "8000:8000"  # Ray Serve
      - "10001:10001"  # Ray client
      - "6379:6379"  # Ray GCS
      - "8081:8081"  # Metrics export
    volumes:
      - ../../../:/workspace
    working_dir: /workspace
    command: >
      bash -c "pip install -e . &&
               pip install --upgrade 'msgpack>=1.1.1' &&  # Fix conda-libmamba-solver conflict
               ray start --head --node-ip-address=0.0.0.0 --dashboard-host=0.0.0.0 --port=6379 --dashboard-port=8265 --ray-client-server-port=10001 --metrics-export-port=8081 &&
               tail -f /dev/null"
    environment:
      - LLM_HOST=llm-server
      - RAY_GRAFANA_HOST=http://grafana:3000
      - RAY_GRAFANA_IFRAME_HOST=http://localhost:3001
      - RAY_PROMETHEUS_HOST=http://prometheus:9090
    depends_on:
      - llm-server
    healthcheck:
      test: ["CMD", "ray", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"  # Prometheus UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - ray-server

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"  # Grafana UI
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./grafana-dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SECURITY_COOKIE_SAMESITE=none
      - GF_SECURITY_COOKIE_SECURE=false
      - GF_SECURITY_X_FRAME_OPTIONS=SAMEORIGIN
    depends_on:
      - prometheus

volumes:
  ollama_data:
  prometheus_data:
  grafana_data:
